# Builds everything and publishes a GitHub release when a version tag (v1.2.3) is pushed.
#   apk            Android app (android.yml)
#   scrcpy-server  scrcpy 5.0.1 server with scrcpy/symphone-server.patch
#   windows        native helpers (MSVC), virtual camera, Windows app (PyInstaller), installer + zip
#   linux          Linux app (PyInstaller, Qt WebEngine), tar.gz + .deb
#   macos          macOS app (PyInstaller, Apple silicon), .dmg
#   release        all of the above as one GitHub release
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  SCRCPY_VERSION: "5.0.1"
  RCLONE_VERSION: "1.75.2"

jobs:
  apk:
    uses: ./.github/workflows/android.yml
    secrets: inherit

  scrcpy-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: Build the patched server
        run: |
          git clone --depth 1 --branch "v$SCRCPY_VERSION" https://github.com/Genymobile/scrcpy.git "$RUNNER_TEMP/scrcpy"
          cd "$RUNNER_TEMP/scrcpy"
          git apply "$GITHUB_WORKSPACE/scrcpy/symphone-server.patch"
          ./gradlew :server:assembleRelease --no-daemon
          cp server/build/outputs/apk/release/server-release-unsigned.apk "$GITHUB_WORKSPACE/scrcpy-server"
      - uses: actions/upload-artifact@v5
        with:
          name: scrcpy-server
          path: scrcpy-server

  windows:
    needs: [apk, scrcpy-server]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: actions/download-artifact@v5
        with:
          name: apk
          path: dist
      - uses: actions/download-artifact@v5
        with:
          name: scrcpy-server
          path: server

      - name: Tools (scrcpy + patched server, rclone, svcl)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tools, "$env:RUNNER_TEMP\dl" | Out-Null
          $dl = "$env:RUNNER_TEMP\dl"
          Invoke-WebRequest "https://github.com/Genymobile/scrcpy/releases/download/v$env:SCRCPY_VERSION/scrcpy-win64-v$env:SCRCPY_VERSION.zip" -OutFile "$dl\scrcpy.zip"
          Expand-Archive "$dl\scrcpy.zip" tools
          Copy-Item server\scrcpy-server "tools\scrcpy-win64-v$env:SCRCPY_VERSION\scrcpy-server" -Force
          Invoke-WebRequest "https://downloads.rclone.org/v$env:RCLONE_VERSION/rclone-v$env:RCLONE_VERSION-windows-amd64.zip" -OutFile "$dl\rclone.zip"
          Expand-Archive "$dl\rclone.zip" tools
          Invoke-WebRequest "https://www.nirsoft.net/utils/svcl-x64.zip" -OutFile "$dl\svcl.zip"
          Expand-Archive "$dl\svcl.zip" tools\svcl
          Get-ChildItem tools

      - name: Native helpers (side display) and virtual camera
        shell: pwsh
        run: |
          cmd /c sidecar\native\build.cmd
          if ($LASTEXITCODE) { throw "sidecar build failed" }
          & vcam\build.ps1

      - name: Windows app
        shell: pwsh
        run: |
          py -3.14 -m venv pc\.venv
          pc\.venv\Scripts\python -m pip install --upgrade pip
          pc\.venv\Scripts\pip install -r pc\requirements.txt
          & pc\build.ps1

      - name: Package (installer + zip)
        id: pkg
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { "0.0.0-dev.$env:GITHUB_RUN_NUMBER" }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Q "/DAppVersion=$ver" setup\symphone.iss
          if ($LASTEXITCODE) { throw "installer build failed" }
          Compress-Archive -Path pc\dist\Symphone -DestinationPath "Symphone-$ver-windows-x64.zip"
          Copy-Item "dist\Symphone-Setup-$ver.exe" .
          Copy-Item "dist\Symphone-Setup-$ver.exe" Symphone-Setup.exe     # stable names: releases/latest/download/...
          Copy-Item dist\Symphone.apk "Symphone-$ver.apk"
          Copy-Item dist\Symphone.apk Symphone.apk
          "files=Symphone-Setup-$ver.exe Symphone-Setup.exe Symphone-$ver-windows-x64.zip Symphone-$ver.apk Symphone.apk" >> $env:GITHUB_OUTPUT
          "ver=$ver" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v5
        with:
          name: symphone-windows
          path: |
            Symphone-Setup*.exe
            Symphone-*.zip
            Symphone*.apk

  posix:
    needs: [apk, scrcpy-server]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04          # oldest glibc the build should run on
            name: linux
            scrcpy: linux-x86_64
            rclone: linux-amd64
          - os: macos-14
            name: macos
            scrcpy: macos-aarch64
            rclone: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: actions/download-artifact@v5
        with:
          name: apk
          path: dist
      - uses: actions/download-artifact@v5
        with:
          name: scrcpy-server
          path: server

      - name: Tools (scrcpy + patched server, rclone)
        run: |
          mkdir -p tools "$RUNNER_TEMP/dl"
          curl -sSLf -o "$RUNNER_TEMP/dl/scrcpy.tgz" "https://github.com/Genymobile/scrcpy/releases/download/v$SCRCPY_VERSION/scrcpy-${{ matrix.scrcpy }}-v$SCRCPY_VERSION.tar.gz"
          tar -xzf "$RUNNER_TEMP/dl/scrcpy.tgz" -C tools
          cp server/scrcpy-server tools/scrcpy-${{ matrix.scrcpy }}-v$SCRCPY_VERSION/scrcpy-server
          curl -sSLf -o "$RUNNER_TEMP/dl/rclone.zip" "https://downloads.rclone.org/v$RCLONE_VERSION/rclone-v$RCLONE_VERSION-${{ matrix.rclone }}.zip"
          unzip -q "$RUNNER_TEMP/dl/rclone.zip" -d tools
          ls tools

      - name: System packages
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxcb-cursor0 libegl1 libxkbcommon-x11-0

      - name: App and packages
        run: |
          ver=$([ "$GITHUB_REF_TYPE" = tag ] && echo "${GITHUB_REF_NAME#v}" || echo "0.0.0-dev.$GITHUB_RUN_NUMBER")
          python -m venv pc/.venv
          pc/.venv/bin/python -m pip install --upgrade pip
          pc/.venv/bin/pip install -r pc/requirements.txt
          sh pc/build.sh "$ver"
          ls -la dist

      - uses: actions/upload-artifact@v5
        with:
          name: symphone-${{ matrix.name }}
          path: |
            dist/Symphone-*.tar.gz
            dist/symphone_*.deb
            dist/Symphone-*.dmg

  release:
    if: github.ref_type == 'tag'
    needs: [windows, posix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: symphone-*
          path: out
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          cd out
          # stable names too: releases/latest/download/Symphone.dmg, symphone_amd64.deb ...
          cp "Symphone-$ver-macos-arm64.dmg" Symphone.dmg
          cp "symphone_${ver}_amd64.deb" symphone_amd64.deb
          ls -la
          gh release create "$GITHUB_REF_NAME" * --repo "$GITHUB_REPOSITORY" --title "Symphone $ver" --generate-notes
