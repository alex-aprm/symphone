# Builds the Android app (signed with the release key from the repository secrets when available).
name: Android app

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**"]
  workflow_dispatch:
  workflow_call:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.SYMPHONE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "SYMPHONE_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key in the repository secrets: the APK is signed with a throwaway debug key"
          fi

      - name: Build
        working-directory: android
        env:
          SYMPHONE_KEYSTORE_PASSWORD: ${{ secrets.SYMPHONE_KEYSTORE_PASSWORD }}
          SYMPHONE_KEY_ALIAS: ${{ secrets.SYMPHONE_KEY_ALIAS }}
          SYMPHONE_KEY_PASSWORD: ${{ secrets.SYMPHONE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Symphone.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: Symphone.apk
